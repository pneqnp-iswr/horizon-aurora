name: Verify Aurora native mod

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  source-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Offline source and package checks
        run: |
          python3 tests/static_validate.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tests/package.py
          python3 tests/shader_static.py
          python3 tests/package_shader.py
      - name: Pure Rust unit tests
        run: cargo test --manifest-path Cargo.toml
      - name: Verify Aurora Nebula with official Horizon WGSL checker
        run: |
          git clone https://github.com/horizon-rust/horizon.git /tmp/horizon
          git -C /tmp/horizon checkout 97ded175738a56163e40698be72e968d9b956f73
          cargo run --locked --manifest-path /tmp/horizon/Cargo.toml -p horizon-shader-api --bin horizon-shader -- check "$GITHUB_WORKSPACE/shaderpacks/aurora_nebula"
      - name: Checkout upstream mod tools
        run: git clone --depth 1 https://github.com/horizon-rust/horizon-mods.git /tmp/horizon-mods
      - name: Stage Aurora for official integration tool
        run: |
          mkdir -p /tmp/horizon-mods/native/aurora
          cp compatibility.json Cargo.toml /tmp/horizon-mods/native/aurora/
          cp -R mixins /tmp/horizon-mods/native/aurora/
      - name: Install Horizon native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev
      - name: Compile entire Horizon game with Aurora hooks
        working-directory: /tmp/horizon-mods
        run: python3 native/tools/native.py check aurora

      - name: Rebuild .hnmod with official Horizon packaging
        working-directory: /tmp/horizon-mods
        run: python3 native/tools/native.py package aurora
      - name: Pack shader using official Horizon validator
        run: cargo run --locked --manifest-path /tmp/horizon/Cargo.toml -p horizon-shader-api --bin horizon-shader -- pack "$GITHUB_WORKSPACE/shaderpacks/aurora_nebula"
      - name: Collect verified source bundles
        run: |
          mkdir -p dist
          cp /tmp/horizon-mods/native/target/aurora_visuals-0.3.0.hnmod dist/
          cp shaderpacks/aurora_nebula-0.3.0.hshader dist/
          cd dist
          sha256sum *.hnmod *.hshader > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-v0.3.0-verified-bundles
          path: dist/*
          if-no-files-found: error

  publish-prerelease:
    name: Publish tested source-bundle prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: source-and-integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aurora-v0.3.0-verified-bundles
          path: dist
      - name: Publish only after all official integration checks succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.3.0-rc.1
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Prerelease $TAG already exists; leaving published assets unchanged."
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Aurora Visuals v0.3.0 RC1" \
            --prerelease \
            --notes "Experimental Horizon native source bundle and WGSL shader pack. Official native integration and shader validation pass in CI; gameplay testing is still required. Do not install untrusted native code."
